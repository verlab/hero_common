; PlatformIO — HERO robot firmware (ESP8266 + Arduino)
; Abra esta pasta (hero_firmware) como projeto no VS Code/Cursor ou rode: pio run -d hero_firmware
;
; Alinhado às opções típicas do Arduino IDE para "NodeMCU 1.0 (ESP-12E Module)":
;   CPU Frequency: 160 MHz
;   Flash Size: 4M (no SPIFFS)  →  eagle.flash.4m.ld
;   Upload Speed: 115200
;   lwIP Variant: v2 Higher Bandwidth
;   VTables: Flash, Exceptions: Disabled, Erase Flash: Only Sketch (padrão esptool)
; O core Arduino no PIO (framework-arduinoespressif8266) é mais novo que "ESP8266 2.5.0"
; do IDE; o mapa de flash/lwIP abaixo reproduz o *menu*, não a mesma versão de fontes.
;
; Ajuste `board` se o módulo ESP8266 do HERO for outro (ex.: d1_mini, esp12e).

[platformio]
default_envs = hero_esp8266
src_dir = firmware

[env:hero_esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
; PIO 6: lib_extra_dirs deve ficar no [env], não em [platformio]
lib_extra_dirs = libraries
monitor_speed = 115200
upload_speed = 115200

; --- Equivalente ao menu "Tools" do Arduino (NodeMCU 1.0) ---
board_build.f_cpu = 160000000L
; Padrão do board no PIO é 4M1M; no IDE você usa "4M (no SPIFFS)" = FS:none
board_build.ldscript = eagle.flash.4m.ld
board_build.flash_mode = dio

build_flags =
  ; lwIP v2 Higher Bandwidth (TCP_MSS=1460, lib lwip2-1460-feat) — ver platformio-build.py do core
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
  ; ros_lib é só headers — garante <ros.h> e mensagens ROS para o sketch
  -I${PROJECT_DIR}/libraries/ros_lib

lib_ldf_mode = deep+

; Bibliotecas grandes / não usadas pelo firmware principal (acelera o LDF)
lib_ignore =
  Adafruit_PWM_Servo_Driver_Library
  MD_TCS230
  L3G
  SFE_BMP180

; Upload troubleshooting (Linux): OSError [Errno 71] Protocol error on setDTR/setRTS
; → another USB port/cable, user in group dialout, close serial monitors.
; → Some systems run brltty on ttyUSB*:  sudo systemctl stop brltty  (or disable the grab rule).
; → Or use env below (no DTR/RTS): put ESP in download mode (hold FLASH, tap RST, release FLASH), then upload.
; upload_resetmethod = ck
;
[env:hero_esp8266_no_dtr]
extends = env:hero_esp8266
upload_flags =
    --before
    no_reset
    --after
    hard_reset
; Example:  pio run -e hero_esp8266_no_dtr -t upload --upload-port /dev/ttyUSB0
